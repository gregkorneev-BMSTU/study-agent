[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-agent"
version = "0.1.0"
description = "Local-first search and analysis of educational materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.10.3,<6.11"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]
packaging = [
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_agent = ["assets/sf_symbols/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
