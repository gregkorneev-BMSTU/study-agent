name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - run: python -m pip install '.[dev]'
      - run: pytest
      - run: ruff check .

  macos-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check saved search roots with an invalid bookmark
        run: |
          swiftc -o /tmp/study-agent-saved-folders macOS/StudyAgent/SavedFolder.swift tests/macos_client/main.swift
          /tmp/study-agent-saved-folders
      - name: Check failed library operations can be retried
        run: |
          swiftc -D DEBUG -parse-as-library -o /tmp/study-agent-model-queue macOS/StudyAgent/{SavedFolder,Localization,StudyAgentModel}.swift tests/macos_client/model_queue.swift
          /tmp/study-agent-model-queue
      - name: Build macOS client
        run: xcodebuild -project macOS/StudyAgent.xcodeproj -scheme 'Study Agent' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  windows-checks:
    name: Windows checks (Python 3.12 / WinUI)
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build WinUI application
        run: |
          dotnet build "./windows/StudyAgent.Windows/StudyAgent.Windows.csproj" `
            -c Debug -r win-x64 -p:Platform=x64

      - name: Prepare backend packaging environment
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install ".[dev]" pyinstaller

      - name: Build Windows backend
        if: github.event_name == 'workflow_dispatch'
        run: |
          .\scripts\build_windows_backend.ps1

      - name: Upload unsigned backend artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: study-agent-windows-backend-unsigned
          path: build/windows-backend/dist/StudyAgentBackend/
          if-no-files-found: error
