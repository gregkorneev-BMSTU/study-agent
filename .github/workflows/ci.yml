name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - run: python -m pip install '.[dev]'
      - run: pytest
      - run: ruff check .

  macos-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check saved search roots with an invalid bookmark
        run: |
          swiftc -o /tmp/study-agent-saved-folders macOS/StudyAgent/SavedFolder.swift tests/macos_client/main.swift
          /tmp/study-agent-saved-folders
      - name: Check failed library operations can be retried
        run: |
          swiftc -D DEBUG -parse-as-library -o /tmp/study-agent-model-queue macOS/StudyAgent/{SavedFolder,Localization,StudyAgentModel}.swift tests/macos_client/model_queue.swift
          /tmp/study-agent-model-queue
      - name: Build macOS client
        run: xcodebuild -project macOS/StudyAgent.xcodeproj -scheme 'Study Agent' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  windows-checks:
    name: Windows checks (Python 3.12 / WinUI)
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build WinUI application
        run: |
          dotnet build "./windows/StudyAgent.Windows/StudyAgent.Windows.csproj" `
            -c Debug -r win-x64 -p:Platform=x64

      - name: Prepare backend packaging environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install ".[ocr,packaging]"

      - name: Build Windows backend
        run: |
          .\scripts\build_windows_backend.ps1

      - name: Smoke test packaged backend with synthetic documents
        run: .\scripts\smoke_windows_backend.ps1

      - name: Build Windows Release package
        run: |
          dotnet build "./windows/StudyAgent.Windows/StudyAgent.Windows.csproj" `
            -c Release -r win-x64 -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false

      - name: Publish self-contained Windows application
        run: |
          dotnet publish "./windows/StudyAgent.Windows/StudyAgent.Windows.csproj" `
            -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None `
            --self-contained true -o "./build/windows-publish"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup executable
        run: .\scripts\build_windows_installer.ps1

      - name: Upload Windows setup executable
        uses: actions/upload-artifact@v4
        with:
          name: study-agent-windows-setup
          path: |
            build/windows-installer/StudyAgentSetup.exe
          if-no-files-found: error

  windows-x64-installer:
    name: Install x64 setup on Windows Server
    needs: windows-checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: study-agent-windows-setup
          path: installer
      - name: Install and run application
        shell: pwsh
        run: .\scripts\smoke_windows_installer.ps1 -SetupPath .\installer\StudyAgentSetup.exe

  windows-arm-installer:
    name: Install x64 setup on Windows 11 ARM
    needs: windows-checks
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: study-agent-windows-setup
          path: installer
      - name: Install and run application under x64 emulation
        shell: pwsh
        run: .\scripts\smoke_windows_installer.ps1 -SetupPath .\installer\StudyAgentSetup.exe
